    <script>

         
       
        $(document).ready(function () {
            

            resetMainClass();
            
            _sidebarActive = true;
             

             
            console.log("ready login");
            //$(".app-main").load("./main.html"); 
           
            // update field
            let deviceId = localStorage["DeviceId"];
            if (deviceId != undefined) {
                $("#DeviceId").val(deviceId);

                checkDeviceIsValid(deviceId);
            }
            
 
            
        }); 

        function checkDeviceIsValid(deviceId)
        {
             
            /*
            var dataF = new FormData();
            dataF.append("Action", "CheckTableExists");
            dataF.append("Table", "Device_" + deviceId);
            fetch("./api/generic.php", { method:"post", body:dataF })
                .then(res => res.json())
                .then(data => onCheckDeviceIsValid(data, deviceId));
            */    
            var dataF = new FormData();
            dataF.append("Action", "GetList");
            dataF.append("Table", "Activities");
            dataF.append("DeviceId", deviceId);
            fetch("./api/generic.php", { method:"post", body:dataF })
                .then(res => res.json())
                .then(data => onCheckDeviceIsValid(data, deviceId));
                
        }

        function onCheckDeviceIsValid(data, deviceId)
        {
             
            console.log(data);
                
            if (data.List.length == 0)
            {
                console.warn("Device not found");

                showToastMessage("Dispositivo non trovato", "error");
                
            }
            else    // already exist
            {
                  
                console.log('device login ok');

                localStorage["LoginStatus"] ="Ok";
                localStorage["DeviceId"] = deviceId;

                showToastMessage("Accesso eseguito", "success");

                $(".app-main").load("./main.html");   
                     
            }

        }


        $(document).on('click', '.btn-enter', function() {

             
            let deviceId = $("#DeviceId").val();
            
            
            if (deviceId.length==0) {

                showToastMessage("Credenziali non corrette", "error");
                return;
            }

            checkDeviceIsValid(deviceId);

            //

            //$(".app-main").load("./main.html");   
        });


        
    </script>
    

</body>
