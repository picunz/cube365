 

<style>

        height: 100%;

    .container {
        width: 40%;
        display: grid;
        place-items: center;

    .container form {

    }

        background-color:#ecf0f3
    }

<div class="p-4">
    <div>
        
        <div class="row">
            <div>
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newTaskModal">Add task</button>
            </div>
        </div>

        <div>
            <div id="listTask"></div>
        </div>

      
    </div>

</div>

<div class="modal fade" id="newTaskModal" tabindex="-1" aria-labelledby="newTaskModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="newTaskModalLabel">New Task</h3>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body">
                <div class="container" style="width:100%;">
                    <div class="formWrapper">
                        <form>
                            <label for="floatingSelectSide" class="">Side</label>

                            <select class="form-select" id="floatingSelectSide">
                                <option selected="" style="display: block;">-</option>
                                <option class="text-warning" value="LEFT" style="display: none;">LEFT</option>
                                <option class="text-primary" value="RIGHT" style="display: none;">RIGHT</option>
                                <option class="text-danger" value="FRONT" style="display: none;">FRONT</option>
                                <option class="text-dark" value="TOP" style="display: block;">TOP</option>
                                <option class="text-success" value="BACK" style="display: none;">BACK</option>
                                <option class="text-light" value="BASE" style="display: block;">BASE</option>
                            </select>
                            
                    

                            <label for="NewType" class="">Type</label>
                            <input placeholder="Type" id="NewType" />

                            <label for="NewTask" class="">Task</label>
                            <input placeholder="Task" id="NewTask" />

                        </form>
                    </div>

                    <div class="formFooter">
                        <button type="button" class="submitButton btn-newtask">submit form</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
 
 

<script>

    var ColorClassDictionary = {
        "LEFT": "btn-warning",
        "RIGHT": "btn-primary",
        "FRONT": "btn-danger",
        "BACK": "btn-success",
        "BASE": "btn-light",
        "TOP": "btn-dark"
    };
    
    function ConvertToIsoDate(date) // not used
    {
        var t = date.toLocaleTimeString('it-IT', {
            timeZone: 'Europe/Rome',
        });
        var lPos = t.lastIndexOf(":");
        t =  t.slice(0, lPos);

        if (t=="00:00") {
            date.setHours(3);
        }
        var dt = date.toISOString();
        var d = dt.split('T')[0];
        
        return d + "T" + t;
    }

    function closeNewTaskModal()
    {
        var modalElement = document.getElementById('newTaskModal');
        if (!modalElement || !window.bootstrap) {
            return;
        }

        var modalInstance = bootstrap.Modal.getInstance(modalElement);
        if (modalInstance) {
            modalInstance.hide();
        }
    }

    function updateSelectSide()
    {
        $('#floatingSelectSide option').css('display', 'block');


        $('#floatingSelectSide option').each(function() {

            if ($(this).attr("value") != undefined ) {
                var side = $(this).val();
                var self = $(this);
                $("#listTask").children().each(function() {
                    taskSide = $(this).find('.tside').text();
                    if (taskSide == side) {
                        self.css('display', 'none');
                    }
                });
            }
        });
    }

    function getTasks(deviceId)
    {
        /*
        fetch("./api/statistic.php?Action=GetTasks&DeviceId=" + deviceId)
            .then(res => res.json())
            .then(data => onGetTasks(data));
        */
        var data = new FormData();
        data.append("Action", "GetList");
        data.append("Table", "Tasks");
        data.append("DeviceId", deviceId);
        fetch("./api/generic.php", { method:"post", body:data })
            .then(res => res.json())
            .then(data => onGetTasks(data, deviceId));
    }

    function onGetTasks(data)
    {
        console.log(data);
 
        if (data.Error) {
            console.error(data.Error);
            return;
        }

        

        const createInputTask = (id, deviceId, side, name, type) => {
            
            var inputReadonly = "";
            var hideActions = "";
 
            className = ColorClassDictionary[side];

            
            if (side == "TOP") {
                 
                inputReadonly = "readonly";
                hideActions = "display:none;";
            }

            return `
                <div class="container m-3" style="width:100%;max-width: 100%;" side="${side}">
                    <div class="formWrapper">
                        <form style="display:block;">
                            <div class="row my-1" deviceId="${deviceId}">
                                <div class="col-1">
                                    <label class="">Side</label>
                                    <br>
                                    <div class="btn ${className} tside rounded-circle my-3" style="width: 50%;height: 50%;font-size: 10px; align-content:center;">${side}</div>
                                    <!--<div class="textonly tside" style="width:100%;">${side}</div>-->
                                </div>
                                <div class="col-4">
                                    <label class="">Type</label>
                                    <br>
                                    <input ${inputReadonly} class="ttype" style="width:100%;" placeholder="Type" value="${type}" />
                                </div>

                                <div class="col-4">
                                    <label class="">Task</label>
                                    <br>
                                    <input ${inputReadonly} class="tname" style="width:100%;" placeholder="Task" value="${name}" />
                                </div>

                                <div class="col-3 d-flex flex-column align-items-end">
                                    <div style="${hideActions}">
                                        <label class=""></label>
                                        <br>
                                        <button type="button" class="btn btn-success btn-updatetask my-3">save</button>
                                        <button type="button" class="btn btn-danger btn-deletetask my-3">delete</button>
                                    </div>
                                    <div style="${side == "TOP" ? "display:block;" : "display:none;"}">
                                        <label class=""></label>
                                        <br>
                                        <p class="text text-danger my-3">Recharge side</p>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        };

        $("#listTask").children().remove();
        var len = data.List.length;
        if (len == 0) {
            alert("no task");
        }

        var content = data.List[0].Content;
       
        var jContent = JSON.parse(content);
        len = jContent.length;

        if (len == 0) {
            alert("no task");
        }

        // get jContent with side == top
        // recharge base is top side
        var rechargeBase = jContent.filter(task => task.Side == "TOP");

        var obj = createInputTask(0, data.DeviceId, rechargeBase[0].Side, "-", "-");
        $("#listTask").append(obj);

        for(var i = 0; i < len; i++) {

            if (jContent[i].Side == "TOP") {
                continue;
            }

            var obj = createInputTask(i, data.DeviceId, jContent[i].Side, jContent[i].Name, jContent[i].Type);
            $("#listTask").append(obj);
        }

        updateSelectSide();
    }
    

    $(document).ready(function() {

        _sidebarActive = false;

        $(".link-home").show();

        $("#btn-send").show();

        // $("#menu-link").hide();

        $(".fa-bell").hide();
 
        resetMainClass();

        $(".app-main").addClass('viewConfigure');

        var deviceId = localStorage["DeviceId"];
        getTasks(deviceId);
  
        
        setInterval(function() {

            getCurrentStatus(deviceId, onGetCurrentStatus);

        }, 1000);
    });

    
    
    function onGetCurrentStatus(data)
    {
        console.log(data);

        var list = data.List;

        $(".container[side]").css("box-shadow", "none");
 
        if (list.length == 1) {
 
            var side = list[0].Side;

            $(".container[side='" + side + "']").css("box-shadow", "inset -1px -1px 6px 4px #212334");
        }
    }

    $(".btn-newtask").on('click', function (e) {
        e.preventDefault();
         
        var side = $("#floatingSelectSide").val();
        if (side == "-") {
            alert("no side selected");
            return;
        }

        var name = $("#NewTask").val();
        if (name == "") {
            alert("no task selected");
            return;
        }

        var type = $("#NewType").val();
        if (type == "") {
            alert("no type selected");
            return;
        }


        //var taskLine = side + "," + task + "," + type + ";";

        var task = {};

        task.Side = side;
        task.Name = name;
        task.Type = type;
 
        var fdata = new FormData();
        fdata.append("Action", "SendTask");
        fdata.append("DeviceId", localStorage["DeviceId"]);
        fdata.append("Task", JSON.stringify(task));
          
        fetch("./api/statistic.php", { method:"post", body:fdata })
            .then(res => res.json())
            .then(data => onNewTask(data)); 
    });
        
    function onNewTask(data)
    {
        console.log(data);

        showToastMessage("Added task", "success");

        $("#floatingSelectSide").val("-");
        $("#NewTask").val("");
        $("#NewType").val("");

        closeNewTaskModal();

        updateSelectSide();

        getTasks(data.DeviceId);

        //$(".btn-gettasks").click();
    }

    $(document).on('click', ".btn-updatetask", function (e) {
          
        var row = $(this).closest('.row');
        var side = row.find('.tside').text();
        var deviceId = row.attr("deviceId");

        var task = {};
        task.Side = side;
        task.Name = row.find('.tname').val();
        task.Type = row.find('.ttype').val();

        var fdata = new FormData();
        fdata.append("Action", "SendTask");
        fdata.append("DeviceId", deviceId);
        fdata.append("Task", JSON.stringify(task));

        fetch("./api/statistic.php", { method: "POST", body: fdata})
            .then(res => res.json())
            .then(data => onUpdateTaskBySide(data));
            
    });

    function onUpdateTaskBySide(data)
    {
        
        console.log(data);

        showToastMessage("Updated task", "success");

        getTasks(data.DeviceId);
        
    }

    
    $(document).on('click', ".btn-deletetask", function (e) {
            
        var row = $(this).closest('.row');
        var side = row.find('.tside').text();
        var deviceId = row.attr("deviceId");

        fetch("./api/statistic.php?Action=DeleteTaskBySide&DeviceId=" + deviceId + "&Side=" + side)
            .then(res => res.json())
            .then(data => onDeleteTaskBySide(data, $(this)));
    });
        
    function onDeleteTaskBySide(data)
    {
        console.log(data);

        getTasks(data.DeviceId);
    }

    $(document).on('click', "#TestDb", function (e) {
        /*
        var task = {};

        task.Side = "Left";
        task.Name = "Name";
        task.Type = "Type";

        var fdata = new FormData();
        fdata.append("Action", "SendTask2");
        fdata.append("DeviceId", localStorage["DeviceId"]);
        fdata.append("Task", JSON.stringify(task));
         
        fetch("./api/statistic.php", { method:"post", body:fdata })
            .then(res => res.json())
            .then(data => onSendTask(data)); 
        */
    });
    
 
     
</script>
