<script>

    $(document).ready(function(){

        console.log('ready main.html');
        _sidebarActive = true;

        $(".containerNM").appendTo(".container-fluid");

        resetMainClass();
        $(".app-main").addClass('mainBackground');

        
 

        var miniScreen = window.matchMedia("(max-width: 375px)").matches;

        var innerWidth = window.innerWidth;
        var screenWidth = screen.width;

        console.log("miniscreen 375:" + miniScreen);
        console.log("innerWidth:" + innerWidth);
        console.log("screenWidth:" + screenWidth);
        

        // only for mobile
        if (localStorage["OS"] != undefined && localStorage["OS"] != 'unknown') {
            setTimeout(function(){

                
                if (false) {
                    $(".mainBackground").addClass('mainBackgroundMoveMini');
                }
                else {
                    $(".mainBackground").addClass('mainBackgroundMove');
                }
                  

            }, 500);
        }

        
         
        $(".link-home").hide();


        $("#menu-link").show();

       
        // show link home

        $(".app-main").load("./viewArchive.html");
    });
    

     

    $("#btn-configure").on('click', function() {
