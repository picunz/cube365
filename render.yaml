    <script>

      $(document).ready(function() {
        
        console.log("index.html");

        $("#version").text(AppVersion);

      //  customLog();
       

        $("#adminlte-navbar").load("./adminlte/helpers/navbar.php?page='report'");
        $("#adminlte-sidebar").load("./adminlte/helpers/sidebar.php");
        
         


          let el = document.createElement('div');
          document.body.appendChild(el);
          eruda.init({
            container: el,
            tool: ['console', 'elements']
          });  


          ready2();

          
          //var userId = localStorage["UserId"];
          var userId = localStorage["UserId"];
          if  (userId == undefined) {
            
            // normally sidebar is close!
            $("body").addClass("sidebar-collapse");
            $("body").removeClass("sidebar-open");
            
            
            
            $(".app-main").load("./adminlte/helpers/loginPage.html");
          }
          

        //});

        console.log("addEventListener");
        window.addEventListener("message", function(event) {
          console.log("Originnnnnnnnn:", event.origin);
             
            console.log("Origin:", event.origin);
            if (event.origin !== "https://sito-esterno.com") {
                console.warn("Origine non autorizzata:", event.origin);
                return;
            }
            console.log("Messaggio ricevuto:", event.data);
            event.source.postMessage("Messaggio ricevuto con successo!", event.origin);
        });

      });

      
      var _sidebarActive = false;

      function ready2()
      {
        console.log('ready2 index.html');

        $('[data-toggle="tooltip"]').tooltip({html: true}); 


        //localStorage.removeItem('sidebar-collapse'); // Cancella lo stato salvato
        //document.body.classList.add('sidebar-collapse'); // Forza la sidebar collassata

        // ionserire nel custom.js
        // disabled overlay
        $(document).on('click', function (e) {
            if (!_sidebarActive) {
              console.log("sidebar disabled on click");
              $("body").removeClass('sidebar-open');
            }
        }); 

        window.addEventListener('resize', function (e) {             
          e.preventDefault();
          //if (!_sidebarActive) {
              console.log("sidebar disabled on resize");
              $("body").removeClass('sidebar-open');
          //  }
        });


        // *** audio player **
       
         
        audioPlayer = new AudioPlayer();
        audioPlayer.init(console.log);

        const soundPath = 'sounds/';
        const soundList = [
            'test',
            'click'
        ];

        audioPlayer.downloadSounds(soundPath, soundList, ["mp3"])
        .then(() => {
            console.log("AudioPlayer: download sound");
           
            return;
        })
        .then(() => {
            console.log('Sounds are ready');
        });

        // *** notifications

        getMyNotifications(localStorage["userId"], function(data) {

          console.log(data);
          
          if(data.List.length > 0) {

            
            var hasNotifications = data.List.some(item => item.IsRead == 0);

            if (hasNotifications)
            {
              $(".link-notification").show();
              $(".link-notification").addClass('fa-beat');
            }
          }
        });

        $(document).on('click', '.link-notification', function() {

          $(".app-main").load("viewNotifications.html");
        });
            

        
      }

