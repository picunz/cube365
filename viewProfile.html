<script>

    var _listRace = null;
    var _listWin = null;

    var _donutChart = null; 

    $('[data-toggle="tooltip"]').tooltip(); 


    $("#imgPreview").on('click', function() {
		$("#upload-image").click();
	});

 

    $(document).ready(function () {
        let croppieInstance;

        // Gestione caricamento immagine
        $('#upload-image').on('change', function (event) {

            $("#currentProfile").hide();

            $("#SaveProfileImage").show();

            $("#result").css("position", "relative");

            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    // Distruggi precedente istanza di Croppie se esiste
                    if (croppieInstance) croppieInstance.destroy();

                    // Crea nuova istanza di Croppie
                    croppieInstance = new Croppie($('#croppie-container')[0], {
                        viewport: { width: 200, height: 200, type: 'circle' },
                        boundary: { width: 300, height: 300 },
                    });

                    // Carica immagine nell'area di ritaglio
                    croppieInstance.bind({ url: e.target.result });
                    $('#crop-button').show();
                    
                    $('#croppie-container').on('update.croppie', function () {
                        croppieInstance.result({
                            type: 'base64',
                            size: 'viewport'
                        }).then(function (base64) {
                                $('#result').attr('src', base64);
                                $('#result').css('opacity', '1.0');
                        });
                    });
                    
                };
                reader.readAsDataURL(file);
            }
        });

        // Evento per ritagliare
        $('#crop-button').on('click', function () {
        //$("img").on("mouseon", function () {
             
            croppieInstance.result({ type: 'base64', size: 'viewport' }).then((base64) => {
                $('#result').attr('src', base64).show(); // Mostra immagine ritagliata
            });
        });
    });

    // save image

        var dataImg = $("#result").attr('src');

        var dottedFullname = $("#fullname").text().replace(/ /g, '.');

        var fdata = new FormData();

        fdata.append('FileName', fileName);
        fdata.append("ImageData", dataImg);
        debugger
        fetch("./api/upload.php", { method:"post", body:fdata })

        function onUploadImageProfile(data)
        {
            console.log(data);

            //$(".app-main").load("./viewProfile.html");
            location.reload();
        }    
    });



    var _colorsDonut = [
        'rgba(255, 99, 132, 0.7)',
        'rgba(54, 162, 235, 0.7)',
        'rgba(255, 206, 86, 0.7)',
        'rgba(75, 192, 192, 0.7)',
        'rgba(153, 102, 255, 0.7)',
        'rgba(54, 162, 235, 0.7)',
        'rgba(255, 206, 86, 0.7)',
        'rgba(75, 192, 192, 0.7)',
        'rgba(153, 102, 255, 0.7)',
        'rgba(240, 128, 128, 0.7)'
    ];



       

    var config = {
        type: 'doughnut',
        //data: data,
        borderWidth: 1,
        cutout: '95%',
        options: {
            responsive: true,
            plugins: {
                legend: {
                    display: false // Nasconde la legenda standard
                }
            },
            layout: {
                padding: 50
            },
            //maintainAspectRatio: false
        },
        plugins: [{
            id: 'customLabels',
            afterDraw: (chart) => {
                
                const ctx = chart.ctx;
                const chartArea = chart.chartArea;
                const datasets = chart.data.datasets[0];
                const labels = chart.data.labels;

                ctx.save();
                labels.forEach((label, index) => {
                    const meta = chart.getDatasetMeta(0);
                    const pos = meta.data[index].tooltipPosition();

                    ctx.fillStyle = 'black';
                    ctx.font = '16px Arial';
                    ctx.textAlign = 'center';

                    const x = pos.x + (pos.x > chartArea.right ? 20 : 0);
                    const y = pos.y;
                    ctx.fillText(label, x, y);
                });
                ctx.restore();    
            }
        }]
    };
	

    $(document).ready(function () {
        
        _sidebarActive = true;

    function getStatistics()
    {
        var fdata = new FormData();
        fdata.append("Action", "GetStatistics");
        fdata.append('UserId', localStorage["userId"]);
        
        
    }

    function createRaceTab(listRace)
    {
        var len = listRace.length;
        var sum = 0;
        for(var i = 0; i < len; i++)
        {
            $(".raceTab").append('<p class="m-0">' + listRace[i].RaceType + ':<span class="float-end">' + listRace[i].Count + '</span></p>');
            sum += Number(listRace[i].Count); 
        }
        $(".raceTab").append('<p class="m-0 text-danger"> Gare totali:<span class="float-end">' + sum + '</span></p>');
    }

    function loadWinTab(listWin)
    {
        $("#AWin").text(listWin[0]["AWin"]);
        $("#ATop3").text(listWin[0]["ATop3"]);
        $("#ATop10").text(listWin[0]["ATop10"]);

        $("#RWin").text(listWin[0]["RWin"]);
        $("#RTop3").text(listWin[0]["RTop3"]);
        $("#RTop10").text(listWin[0]["RTop10"]);
    }

    function createHeatMapList(dataMap)
    {
         
        var len = Object.keys(dataMap).length;
        
        $("#cityList .clone").remove();

        

        var template = $("#cityList .template");
/*
        var clone = template.clone();
        clone.addClass("clone").removeClass('template').find('.count').text('4');
        template.after(clone.html());
*/
        for (let keyIso in dataMap) {
            if (dataMap.hasOwnProperty(keyIso)) {

                var clone = template.clone();
                clone.addClass("clone").removeClass('template').find('.count').text(dataMap[keyIso]);
                clone.find('.city').text(keyIso);
                clone.show();
                 
                $("#cityList").append(clone);
                console.log(`Chiave: ${keyIso}, Valore: ${dataMap[keyIso]}`);
            }
        }
    }

    function createDonutForRace()
    {
        var len = _listRace.length;

        var raceTypeLabels = [];
        var raceCount = [];
        var raceColors = [];
        for (var i = 0; i < len; i++ )
        {
            raceTypeLabels.push(_listRace[i].RaceType);
            raceCount.push(_listRace[i].Count);
            raceColors.push(_colorsDonut[i]);
        } 

        var data = {
            labels: raceTypeLabels, 
            datasets: [{
                label: 'My Races',
                data: raceCount,
                backgroundColor: raceColors,
            }]
        };

        config.data = data;

        if (_donutChart != null) {
            _donutChart.destroy();
        }

        _donutChart = new Chart($('#myDonutChart'), config);
    }

    function createDonutForWin()
    {
        var winLabels = [];
        var winCount = [];
        var winColors = [];

        var winObj = _listWin[0];

        var i = 0;
        for (const key in winObj) {
            console.log("Campo:", key, "Valore:", winObj[key]);

            if (winObj[key] != 0)
            {
                winLabels.push(key);
                winCount.push(winObj[key]);
                winColors.push(_colorsDonut[i]);
            }
            i++;
        }

        var data = {
            labels: winLabels, 
            datasets: [{
                label: 'My Win Chart',
                data: winCount,
                backgroundColor: winColors,
            }]
        };

        config.data = data;

        if (_donutChart != null) {
            _donutChart.destroy();
        }
        _donutChart = new Chart($('#myDonutChart'), config);
    }

    function onGetStatistics(data)
    {
        console.log(data);

        _listRace = data.ListRace;
        _listWin = data.ListWin;

        createRaceTab(_listRace);
        loadWinTab(_listWin);

        $(".raceTab").show();
        $("#Race").addClass('active');


        //createDonutForRace();
    
    }


    $("#Race").on('click', function() {

        $("#Race").addClass('active');
        $("#Win").removeClass('active');
        $("#Heat").removeClass('active');
        $(".raceTab").show();
        $(".winTab").hide();
        $(".mapTab").hide();

        createDonutForRace();
    });

    $("#Win").on('click', function() {

        $("#Race").removeClass('active');
        $("#Win").addClass('active');
        $("#Heat").removeClass('active');
        $(".raceTab").hide();
        $(".winTab").show();
        $(".mapTab").hide();

        createDonutForWin();
    });

    $("#Heat").on('click', function() {

        $("#Race").removeClass('active');
        $("#Win").removeClass('active');
        $("#Heat").addClass('active');

        $(".raceTab").hide();
        $(".winTab").hide();
        $(".mapTab").show()

        var userId = localStorage["userId"];

         
    });

    
     
    

</script>
