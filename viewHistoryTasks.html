<script>
    var _taskHistoryMemory = [];

    function secondsToWorkedTime(seconds)
    {
        var hours = Math.floor(seconds / 3600);
        var minutes = Math.floor((seconds % 3600) / 60);
        return String(hours).padStart(2, '0') + 'h:' + String(minutes).padStart(2, '0') + 'm';
    }

    function formatTaskName(value)
    {
        return '<span class="task-name">' + value + '</span>';
    }

    function formatTaskType(value)
    {
        return '<span class="task-type-badge">' + value + '</span>';
    }

    function parseIsoDate(dateString)
    {
        var parts = String(dateString || '').split('-');
        if (parts.length !== 3) {
            return null;
        }

        return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    }

    function formatMonthYear(dateString)
    {
        var date = parseIsoDate(dateString);
        if (!date || Number.isNaN(date.getTime())) {
            return dateString;
        }

        return date.toLocaleDateString('it-IT', {
            month: 'short',
            year: 'numeric'
        });
    }

    function getIsoWeek(dateString)
    {
        var date = parseIsoDate(dateString);
        if (!date || Number.isNaN(date.getTime())) {
            return '-';
        }

        var tmpDate = new Date(date.getTime());
        tmpDate.setHours(0, 0, 0, 0);
        tmpDate.setDate(tmpDate.getDate() + 3 - ((tmpDate.getDay() + 6) % 7));
        var week1 = new Date(tmpDate.getFullYear(), 0, 4);

        return 1 + Math.round(((tmpDate.getTime() - week1.getTime()) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
    }

    function formatDayLabel(dateString)
    {
        var date = parseIsoDate(dateString);
        if (!date || Number.isNaN(date.getTime())) {
            return dateString;
        }

        return date.toLocaleDateString('it-IT', {
            day: '2-digit',
            month: '2-digit'
        });
    }

    function formatShortHours(seconds)
    {
        var totalMinutes = Math.round(Number(seconds || 0) / 60);
        var hours = Math.floor(totalMinutes / 60);
        var minutes = totalMinutes % 60;

        if (hours === 0) {
            return minutes + 'm';
        }

        if (minutes === 0) {
            return hours + 'h';
        }

        return hours + 'h ' + minutes + 'm';
    }

    function addDays(date, days)
    {
        var result = new Date(date.getTime());
        result.setDate(result.getDate() + days);
        return result;
    }

    function toIsoDateString(date)
    {
        var year = date.getFullYear();
        var month = String(date.getMonth() + 1).padStart(2, '0');
        var day = String(date.getDate()).padStart(2, '0');

        return year + '-' + month + '-' + day;
    }

    function buildDateRange(startDateString, endDateString)
    {
        var startDate = parseIsoDate(startDateString);
        var endDate = parseIsoDate(endDateString);
        var dates = [];

        if (!startDate || !endDate || Number.isNaN(startDate.getTime()) || Number.isNaN(endDate.getTime())) {
            return dates;
        }

        for (var date = new Date(startDate.getTime()); date <= endDate; date = addDays(date, 1)) {
            dates.push(toIsoDateString(date));
        }

        return dates;
    }

    function getBarHeight(seconds, maxSeconds)
    {
        var safeMax = maxSeconds > 0 ? maxSeconds : 1;
        var ratio = seconds / safeMax;
        var minHeight = seconds > 0 ? 16 : 6;
        var maxHeight = 190;

        return minHeight + ((maxHeight - minHeight) * ratio);
    }

    function buildTaskHistoryRows(list)
    {
        var grouped = {};

        for (var i = 0; i < list.length; i++) {
            var dayRow = list[i];
            var details = dayRow.Details;

            if (!Array.isArray(details)) {
                continue;
            }

            for (var detailIndex = 0; detailIndex < details.length; detailIndex++) {
                var detail = details[detailIndex];
                var taskName = detail.Name || '-';
                var taskType = detail.Type || '-';
                var key = taskName + '||' + taskType;

                if (!grouped[key]) {
                    grouped[key] = {
                        Id: key,
                        TaskName: taskName,
                        TaskType: taskType,
                        TotalSeconds: 0,
                        WorkedDays: 0,
                        SidesMap: {},
                        Timeline: []
                    };
                }

                grouped[key].TotalSeconds += Number(detail.CounterSec || 0);
                grouped[key].WorkedDays += 1;
                grouped[key].SidesMap[detail.Side || '-'] = true;
                grouped[key].Timeline.push({
                    Date: dayRow.Date,
                    Side: detail.Side || '-',
                    Seconds: Number(detail.CounterSec || 0),
                    ElapsedTime: detail.ElapsedTime || secondsToWorkedTime(Number(detail.CounterSec || 0))
                });
            }
        }

        var rows = [];
        Object.keys(grouped).forEach(function(key) {
            var item = grouped[key];
            item.TotalWorked = secondsToWorkedTime(item.TotalSeconds);
            item.Sides = Object.keys(item.SidesMap).join(', ');
            item.Timeline.sort(function(a, b) {
                return a.Date.localeCompare(b.Date);
            });
            rows.push(item);
        });

        return rows;
    }

    function renderTaskTimeline(row)
    {
        var groupedByDate = {};
        var orderedDates = [];

        for (var i = 0; i < row.Timeline.length; i++) {
            var day = row.Timeline[i];
            if (!groupedByDate[day.Date]) {
                groupedByDate[day.Date] = {
                    Date: day.Date,
                    Seconds: 0,
                    Sides: {}
                };
                orderedDates.push(day.Date);
            }
            groupedByDate[day.Date].Seconds += Number(day.Seconds || 0);
            groupedByDate[day.Date].Sides[day.Side || '-'] = true;
        }

        orderedDates.sort();

        if (orderedDates.length === 0) {
            return `
                <div class="task-history-summary">
                    <div class="task-history-pill">Task: ${row.TaskName}</div>
                    <div class="task-history-pill">Tipo: ${row.TaskType}</div>
                    <div class="task-history-pill">Giorni: 0</div>
                    <div class="task-history-pill">Totale: 0m</div>
                </div>`;
        }

        var timelineHtml = '';
        var monthHeadersHtml = '';
        var previousMonthLabel = '';
        var maxSeconds = 0;

        for (var maxIndex = 0; maxIndex < orderedDates.length; maxIndex++) {
            var maxDateKey = orderedDates[maxIndex];
            maxSeconds = Math.max(maxSeconds, groupedByDate[maxDateKey].Seconds);
        }

        var allDates = buildDateRange(orderedDates[0], orderedDates[orderedDates.length - 1]);

        for (var dateIndex = 0; dateIndex < allDates.length; dateIndex++) {
            var dateKey = allDates[dateIndex];
            var dayItem = groupedByDate[dateKey] || {
                Date: dateKey,
                Seconds: 0,
                Sides: {}
            };
            var sides = Object.keys(dayItem.Sides).join(', ');
            var monthLabel = formatMonthYear(dayItem.Date);
            var barHeight = getBarHeight(dayItem.Seconds, maxSeconds);
            var isEmpty = dayItem.Seconds === 0;
            var barClass = isEmpty ? 'task-bar-column is-empty' : 'task-bar-column';
            var valueLabel = isEmpty ? '0h' : formatShortHours(dayItem.Seconds);
            var sideLabel = sides ? 'Face: ' + sides : '&nbsp;';

            monthHeadersHtml += '<div class="task-bars-month">' + (monthLabel !== previousMonthLabel ? monthLabel : '&nbsp;') + '</div>';
            previousMonthLabel = monthLabel;

            timelineHtml += `
                <div class="task-bar-day">
                    <div class="${barClass}" style="height: ${barHeight}px;">
                        <div class="task-bar-value">${valueLabel}</div>
                    </div>
                    <div class="task-bar-meta">
                        <div class="task-bar-date">${formatDayLabel(dayItem.Date)}</div>
                        <div class="task-bar-side">${sideLabel}</div>
                    </div>
                </div>`;
        }

        return `
            <div class="task-history-summary">
                <div class="task-history-pill">Task: ${row.TaskName}</div>
                <div class="task-history-pill">Tipo: ${row.TaskType}</div>
                <div class="task-history-pill">Giorni: ${row.WorkedDays}</div>
                <div class="task-history-pill">Totale: ${row.TotalWorked}</div>
                <div class="task-history-pill">Lati: ${row.Sides}</div>
            </div>
            <div class="task-timeline-shell">
                <div class="task-bars-chart">
                    <div class="task-bars-months">${monthHeadersHtml}</div>
                    <div class="task-bars-grid">${timelineHtml}</div>
                </div>
            </div>`;
    }
        
    function formatActions(value, row, index) 
    { 
       
    }

    function detailFormatter(index, row) 
    {
        return renderTaskTimeline(row);
    }

    
    function getActivities()
    {
        var data = new FormData();
        data.append("Action", "GetList");
        data.append("DeviceId", localStorage["DeviceId"]);
        data.append("Table", "Activities");
        fetch("./api/generic.php", { method:"post", body:data })
            .then(res => res.json())
            .then(data => onGetActivities(data));
    }

    function onGetActivities(data)
    {
        console.log(data);

        // keep all source rows in memory, then aggregate by distinct task
        for(var i = 0; i < data.List.length; i++) {
            var item = data.List[i];
            item.Details = JSON.parse(item.Details);
        }

        _taskHistoryMemory = data.List;
        var taskRows = buildTaskHistoryRows(_taskHistoryMemory);
   
        $('#taskstable').bootstrapTable('removeAll');
        $('#taskstable').bootstrapTable('append', taskRows);
    }
