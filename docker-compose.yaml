

services:
  db:
    image: mysql:8.0
    container_name: mysql-local
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: Sql1669990_2
      MYSQL_USER: Sql1669990
      MYSQL_PASSWORD: 25fidenzaLF25!
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"

  app:
    build: .
    container_name: php-app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      # Modalità:
      # - APP_ENV=docker           → MySQL container locale
      # - APP_ENV=docker-remote    → MySQL remoto Aruba (no servizio db)
      # - APP_ENV=production       → MySQL remoto Aruba
      - APP_ENV=docker
    depends_on:
      - db
  
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db

  sqlite-web:
    image: coleifer/sqlite-web
    container_name: sqlite-web
    ports:
      - "8082:8080"
    volumes:
      - ./db:/data
    environment:
      - SQLITE_DATABASE=cube365.sqlite