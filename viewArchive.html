<style>

    .table-hover > tbody > tr:hover > *
    {
        --bs-table-color-state: white;

    thead tr th {

    .blinking {
        animation: blink 1s infinite; /* Imposta il lampeggio ogni 1 secondo */
    }

    @keyframes blink {
        0% { background-color: #f8d7da; }
        50% { background-color: #f5c6cb; }
        100% { background-color: #f8d7da; }
    }

<div class="m-2" style="max-height: 100vh;">
 
    
    <div>
        <h1 class="text-white">Cube Emulator</h1>
        <div class="row">
            <a class="btn btn-success btn-send-face col-1 m-1" face="LEFT">LEFT</a>
            <a class="btn btn-success btn-send-face col-1 m-1" face="RIGHT">RIGHT</a>
            <a class="btn btn-success btn-send-face col-1 m-1" face="FRONT">FRONT</a>

        </div>
        <div class="row">
            <a class="btn btn-primary btn-send-face col-1 m-1" face="MULTIPLE_SIDE">MULTIPLE_SIDE</a>
            <a class="btn btn-primary btn-send-face col-1 m-1" face="NO_SIDE">NO_SIDE</a>

    <h1 class="mb-4"></h1>
    <table 
        id="maintable"
        data-toggle="table"
        data-search="true"
        data-pagination="true"
        data-sortable="true"
        data-detail-view="true"
        data-detail-icon-open="fa fa-plus"
        data-detail-icon-close="fa fa-minus"
        data-detail-formatter="detailFormatter"
        data-sort-name="Date"
        data-sort-order="desc"
        class="table table-bordered">
        <thead class="bg-primary">
            <tr>
                <th data-field="Date" data-sortable="true">Data</th>
                <th data-field="Created" data-sortable="true">Creato il</th>
                <th data-field="LastUpdate" data-sortable="true">Aggiornato il</th>
                
                <th data-field="Actions" data-sortable="false" data-formatter="formatActions" data-cell-style="styleActions"></th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    function startBlinkingRow(rowIndex) 
    {
        var row = $("tr[data-index='" + rowIndex + "']");

        row.find('td').addClass("blinking");
    }


    /*** Excel ***/

    $(document).on('click', '.btn-convert-excel', function() {

        var tr = $(this).closest('tr');
        var fileText = tr.find('td').eq(2).text();  // Todo: remove eq 2

       
        var data = new FormData();
        data.append("Action", "ConvertToExcel");
        data.append("FileText", fileText);
        fetch("./api/excel.php", { method:"post", body:data })
            .then(res => res.json())
            .then(data => onGeExcelConversion(data));


        function onGeExcelConversion(data)
        {
            console.log(data);
 
            if (data.Result)
            {
                showToastMessage("Excel convertito", "success");
            }
        }
    });

    $(document).on('click', '.btn-show-excel', function() {

        var tr = $(this).closest('tr');
        var fileText = tr.find('td').eq(2).text();

        var excelFileName = ChangeFileExtension(fileText, ".xlsx");

        location.href = "./reports/" + excelFileName;

    });


    // *** Emulator ***
    
    $(document).on('click', '.btn-send-face', function() {

        var fdata = new FormData();
        //debugger
        fdata.append("Action", "UpdateState");
        fdata.append("DeviceId", localStorage["DeviceId"]);
        fdata.append("State", $(this).attr('face'));
        
        fetch("./api/statistic.php", { method:"post", body:fdata })
            .then(res => res.json())
            .then(data => onSendFace(data));
            
    });

    $(document).on('click', '.btn-send-getactivities', function() {

        var fdata = new FormData();
        //debugger
        fdata.append("Action", "GetActivities");
        fdata.append("DeviceId", localStorage["DeviceId"]);
        
        fetch("./api/statistic.php", { method:"post", body:fdata })
            .then(res => res.json())
            .then(data => onSendFace(data));
    });

    // refresh task

    $(document).on('click', '.btn-refresh-day', function() {

        debugger
        var trDetail = $(this).closest('tr');
        var tr = trDetail.prev();
        var indexRow = tr.attr("data-index");
        var id = tr.attr("Id");

        var fdata = new FormData();
        fdata.append("Action", "GetItem");
        fdata.append("Table", "Device_" + localStorage["DeviceId"]);
        fdata.append("Id", id);
        fetch("./api/generic.php", { method:"post", body:fdata })
            .then(res => res.json())
            .then(data => onGetDayResult(data, indexRow));
  
    });
    
    function onGetDayResult(data, indexRow)
    {
        console.log(data);
debugger

        const newActivities = JSON.stringify([
        {
            Name: "LEFT",
            Side: "LEFT",
            Time: "00:02",
            CounterSec: 10,
            ElapsedTime: "00:00:10"
        }
        ]);
        
        var activities = data.Item.Activities;

        $('#maintable').bootstrapTable('updateRow', {
            index: indexRow,
            row: {
                Activities: activities
            }
        });

        $('#maintable').bootstrapTable('expandRow', indexRow);
        
    }
